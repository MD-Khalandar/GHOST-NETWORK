syntax = "proto3";

package ghost.contracts.v1;

option java_package = "org.ghost.contracts.v1";
option java_multiple_files = true;

// Shared phone/server wire format. Preserve field numbers and signed origin bytes.

message WirePacketV1 {
  bytes immutable_envelope_bytes = 1;
  bytes signature = 2;
  RelayMetadataV1 relay = 3;
}

message RelayMetadataV1 {
  uint32 remaining_hops = 1;
  uint32 hop_count = 2;
  bytes previous_node_id = 3; // raw 32-byte SHA-256 NodeId; empty at origin
}

message ImmutableEnvelopeV1 {
  uint32 version = 1;
  string packet_id = 2;
  string event_id = 3;
  bytes sender_node_id = 4; // raw 32-byte SHA-256 public-key digest
  bytes sender_signing_public_key = 5;
  DestinationV1 destination = 6;
  EventKindV1 kind = 7;
  int64 created_at_ms = 8;
  int64 expires_at_ms = 9;
  PriorityV1 priority = 10;
  PayloadFormatV1 payload_format = 11;
  bytes payload_bytes = 12;
}

message DestinationV1 {
  DestinationKindV1 kind = 1;
  bytes node_id = 2; // required only when kind is NODE
}

enum DestinationKindV1 {
  DESTINATION_KIND_UNSPECIFIED = 0;
  BROADCAST = 1;
  NODE = 2;
}

enum PriorityV1 {
  PRIORITY_UNSPECIFIED = 0;
  ROUTINE = 1;
  IMPORTANT = 2;
  SOS = 3;
}

enum PayloadFormatV1 {
  PAYLOAD_FORMAT_UNSPECIFIED = 0;
  PROTOBUF = 1;
}

enum EventKindV1 {
  EVENT_KIND_UNSPECIFIED = 0;
  SOS_CREATE = 1;
  SOS_UPDATE = 2;
  HELPER_PROFILE_PUBLISH = 3;
  HELPER_PROFILE_UPDATE = 4;
  OFFER_PUBLISH = 5;
  OFFER_UPDATE = 6;
  CLOUD_ACK = 7;
  MATCH_PROPOSED = 8;
  MATCH_DECLINED = 9;
  MATCH_ACCEPTED = 10;
  MATCH_CONFIRMED = 11;
  DELIVERY_RECEIPT = 12;
  PEER_HELLO = 13;
  INVENTORY = 14;
  NETWORK_ANNOUNCEMENT = 15; // short-lived graph metadata, never cloud-uploaded
  ASSISTANCE_STATUS = 16; // server-signed, destination-specific lifecycle snapshot
  ASSISTANCE_DECISION = 17; // owner-signed, includes server invitation proof
  PRIVATE_CHAT = 18; // participant-signed key, encrypted message or recipient receipt
}

message ConsentV1 {
  bool public_mesh_allowed = 1;
  bool cloud_processing_allowed = 2;
}

// Neighbor-only proof of possession. reply_to echoes the current connection's challenge.
message PeerHelloV1 {
  bytes challenge = 1;
  bytes reply_to = 2;
  bool supports_topology = 3; // send graph updates only to supporting peers
  bool supports_resources = 4; // helper/supply publications (older peers still relay SOS)
  bool supports_offer_updates = 5;
  bool supports_sos_closures = 6;
  bool supports_assistance = 7;
  bool supports_private_chat = 8;
}

enum ConnectivityStatusV1 {
  CONNECTIVITY_UNKNOWN = 0;
  CONNECTIVITY_AVAILABLE = 1;
  CONNECTIVITY_UNAVAILABLE = 2;
}

// Signed by the phone describing its own connections/status. Not a delivery proof.
message NetworkAnnouncementV1 {
  repeated bytes neighbor_node_ids = 1; // at most four authenticated direct peers
  ConnectivityStatusV1 internet = 2; // Android-validated internet, not server access
  bool gateway_configured = 3;
  ConnectivityStatusV1 server = 4; // recent gateway HTTP observation, otherwise unknown
  string display_name = 5; // optional self-chosen public label, at most 40 characters
}

message SosCreateV1 {
  string request_id = 1;
  SosCategoryV1 category = 2;
  string description = 3;
  optional uint32 people_count = 4;
  optional string coarse_area = 5;
  optional string landmark = 6;
  ConsentV1 consent = 7;
  optional double latitude = 8;
  optional double longitude = 9;
}

message SosUpdateV1 {
  string request_id = 1;
  SosStateV1 state = 2;
  optional string note = 3;
  optional bool cloud_processing_allowed = 4;
  // Terminal updates carry ownership proof and may arrive before the SOS.
  bytes original_sos_envelope = 5;
  bytes original_sos_signature = 6;
}

message HelperProfilePublishV1 {
  bytes owner_node_id = 1;
  optional string display_name = 2;
  optional string coarse_area = 3;
  repeated HelpTypeV1 help_types = 4;
  HelperAvailabilityV1 availability = 5;
  ConsentV1 consent = 6;
}

message HelperProfileUpdateV1 {
  bytes owner_node_id = 1;
  optional string display_name = 2;
  optional string coarse_area = 3;
  repeated HelpTypeV1 help_types = 4;
  optional HelperAvailabilityV1 availability = 5;
  optional ConsentV1 consent = 6;
}

message OfferPublishV1 {
  string offer_id = 1;
  bytes owner_node_id = 2;
  ResourceTypeV1 resource_type = 3;
  optional uint32 quantity = 4;
  optional string unit = 5;
  optional string coarse_area = 6;
  optional int64 available_until_ms = 7;
  ConsentV1 consent = 8;
}

message OfferUpdateV1 {
  string offer_id = 1;
  bytes owner_node_id = 2;
  OfferStateV1 state = 3;
  optional uint32 quantity = 4;
  optional string unit = 5;
  optional string coarse_area = 6;
  optional int64 available_until_ms = 7;
  optional string note = 8;
  optional ConsentV1 consent = 9;
  // A complete edit carries the original signed publication, so it can arrive first.
  bytes original_offer_envelope = 10;
  bytes original_offer_signature = 11;
}

message CloudAckV1 {
  string origin_event_id = 1;
  CloudAckStatusV1 status = 2;
  uint64 cloud_revision = 3;
  int64 received_at_ms = 4;
  optional string error_code = 5;
}

message MatchProposedV1 {
  string proposal_id = 1;
  uint32 version = 2;
  string request_id = 3;
  string offer_id = 4;
  string explanation = 5;
  string approval_id = 6;
}

message MatchDeclinedV1 {
  string proposal_id = 1;
  uint32 version = 2;
  bytes offer_owner_node_id = 3;
  optional string reason = 4;
}

message MatchAcceptedV1 {
  string proposal_id = 1;
  uint32 version = 2;
  bytes offer_owner_node_id = 3;
  optional string note = 4;
}

message MatchConfirmedV1 {
  string proposal_id = 1;
  uint32 version = 2;
  string request_id = 3;
  string offer_id = 4;
  string allocation_id = 5;
}

message DeliveryReceiptV1 {
  string packet_id = 1;
  bytes recipient_node_id = 2;
  ReceiptTypeV1 receipt_type = 3;
  int64 observed_at_ms = 4;
}

enum SosCategoryV1 {
  SOS_CATEGORY_UNSPECIFIED = 0;
  SOS_CATEGORY_MEDICAL = 1;
  SOS_CATEGORY_TRAPPED = 2;
  SOS_CATEGORY_WATER = 3;
  SOS_CATEGORY_FOOD = 4;
  SOS_CATEGORY_SHELTER = 5;
  SOS_CATEGORY_OTHER = 6;
}

enum SosStateV1 {
  SOS_STATE_UNSPECIFIED = 0;
  SOS_STATE_OPEN = 1;
  SOS_STATE_ACKNOWLEDGED = 2;
  SOS_STATE_HELP_OFFERED = 3;
  SOS_STATE_CLOSED = 4;
  SOS_STATE_CANCELLED = 5;
  SOS_STATE_RESOLVED = 6;
}

enum HelpTypeV1 {
  HELP_TYPE_UNSPECIFIED = 0;
  HELP_TYPE_FIRST_AID = 1;
  HELP_TYPE_TRANSPORT = 2;
  HELP_TYPE_SEARCH = 3;
  HELP_TYPE_SHELTER = 4;
  HELP_TYPE_FOOD = 5;
  HELP_TYPE_WATER = 6;
  HELP_TYPE_OTHER_HELP = 7;
}

enum HelperAvailabilityV1 {
  HELPER_AVAILABILITY_UNSPECIFIED = 0;
  HELPER_AVAILABILITY_AVAILABLE = 1;
  HELPER_AVAILABILITY_UNAVAILABLE = 2;
  HELPER_AVAILABILITY_UNKNOWN = 3;
}

enum ResourceTypeV1 {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_WATER = 1;
  RESOURCE_TYPE_FOOD = 2;
  RESOURCE_TYPE_SHELTER = 3;
  RESOURCE_TYPE_MEDICAL_SUPPLIES = 4;
  RESOURCE_TYPE_TRANSPORT = 5;
  RESOURCE_TYPE_OTHER_RESOURCE = 6;
}

enum OfferStateV1 {
  OFFER_STATE_UNSPECIFIED = 0;
  OFFER_STATE_AVAILABLE = 1;
  OFFER_STATE_WITHDRAWN = 2;
  OFFER_STATE_EXPIRED = 3;
  OFFER_STATE_PARTIALLY_ALLOCATED = 4;
  OFFER_STATE_FULLY_ALLOCATED = 5;
}

enum CloudAckStatusV1 {
  CLOUD_ACK_STATUS_UNSPECIFIED = 0;
  CLOUD_ACK_STATUS_ACCEPTED = 1;
  CLOUD_ACK_STATUS_DUPLICATE = 2;
  CLOUD_ACK_STATUS_REJECTED = 3;
}

enum ReceiptTypeV1 {
  RECEIPT_TYPE_UNSPECIFIED = 0;
  RECEIPT_TYPE_PERSISTED_BY_RECIPIENT = 1;
  RECEIPT_TYPE_READ_BY_RECIPIENT = 2;
}

// Status: 1 invited, 2 committed, 3 declined, 4 cancelled, 5 expired,
// 6 requester resolved the SOS, 7 requester confirmed this assistance received.
// A commitment is not proof that supplies or assistance have been delivered.
message AssistanceStatusV1 {
  string proposal_id = 1;
  uint32 version = 2;
  string request_id = 3;
  string resource_id = 4;
  uint32 resource_kind = 5; // 1 volunteer, 2 supply
  bytes owner_node_id = 6;
  bytes requester_node_id = 7;
  uint32 state = 8;
  optional uint32 quantity = 9;
  string unit = 10;
  string description = 11;
  string area = 12;
  string explanation = 13;
  int64 deadline_ms = 14;
  string reason = 15;
  uint32 resource_type = 16;
}
message AssistanceDecisionV1 {
  string proposal_id = 1;
  uint32 version = 2;
  uint32 decision = 3; // 1 accept, 2 decline, 3 cancel own commitment, 4 requester confirms received
  bytes status_envelope = 4;
  bytes status_signature = 5;
}

// Metadata is public to relays. Message text is AES-256-GCM ciphertext; the AES
// key is wrapped separately for recipient and sender with RSA-2048 OAEP SHA-256,
// MGF1 SHA-1 (Android Keystore compatible). Keys remain on the phones.
message PrivateChatV1 {
  string proposal_id = 1;
  uint32 type = 2; // 1 encryption public key, 2 encrypted text, 3 recipient persisted receipt
  bytes status_envelope = 3;
  bytes status_signature = 4;
  bytes rsa_public_key = 5;
  string message_id = 6;
  bytes recipient_key_envelope = 7;
  bytes recipient_key_signature = 8;
  bytes nonce = 9;
  bytes ciphertext = 10;
  bytes wrapped_key = 11;
  bytes sender_wrapped_key = 12;
}
